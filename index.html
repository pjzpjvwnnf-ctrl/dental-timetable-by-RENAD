<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental RENAD</title>
    <style>
      :root {
        --bg1: #f7f0ff;
        --bg2: #efe1ff;
        --purple-900: #2d1848;
        --purple-800: #43306d;
        --purple-700: #5f3d9a;
        --purple-600: #7c57c8;
        --purple-500: #8d68dc;
        --lavender-200: #f0e8ff;
        --lavender-100: #faf6ff;
        --white: #ffffff;
        --text: #2c2340;
        --muted: #655b7a;
        --border: rgba(92, 58, 145, 0.15);
        --success: #53b884;
        --shadow: 0 16px 42px rgba(92, 58, 145, 0.14);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, #e9dcff 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      button {
        font: inherit;
      }

      .screen {
        display: none;
        min-height: 100vh;
        padding: 32px 18px 48px;
      }

      .screen.active { display: block; }

      .container {
        max-width: 1120px;
        margin: 0 auto;
      }

      .hero-card {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 36px;
      }

      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--purple-700);
        font-weight: 700;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.4rem, 5vw, 4rem);
        line-height: 1.08;
        color: var(--purple-900);
      }

      .subtitle {
        max-width: 700px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
        margin: 0 0 28px;
      }

      .group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .group-card {
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,235,255,0.9));
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 24px 18px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        box-shadow: 0 10px 26px rgba(87, 57, 145, 0.08);
      }

      .group-card:hover { transform: translateY(-4px); box-shadow: 0 18px 28px rgba(87, 57, 145, 0.12); }

      .group-icon {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        margin: 0 auto 14px;
        background: linear-gradient(135deg, var(--purple-600), var(--purple-500));
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
        font-size: 1.45rem;
      }

      .group-card h3 {
        margin: 10px 0 8px;
        font-size: 1.4rem;
        color: var(--purple-900);
      }

      .group-card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .topbar h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
        color: var(--purple-900);
      }

      .back-btn,
      .secondary-btn {
        border: none;
        background: linear-gradient(135deg, var(--purple-600), var(--purple-500));
        color: white;
        padding: 12px 18px;
        border-radius: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 22px rgba(121, 84, 182, 0.25);
      }

      .secondary-btn {
        background: white;
        color: var(--purple-800);
        border: 1px solid rgba(122, 90, 181, 0.18);
        box-shadow: none;
      }

      .section-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
      }

      .section-card {
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(237,227,255,0.9));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px 18px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .section-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 26px rgba(94, 58, 148, 0.12);
      }

      .section-number {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 14px;
        background: linear-gradient(135deg, #8f5bf3, #b687ff);
        color: white;
        font-size: 1.5rem;
        font-weight: 800;
      }

      .section-card h3 {
        margin: 0;
        color: var(--purple-900);
        font-size: 1.3rem;
      }

      .section-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .progress-panel {
        background: rgba(255,255,255,0.75);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
        margin-bottom: 24px;
      }

      .progress-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        color: var(--purple-900);
        margin-bottom: 14px;
      }

      .progress-bar {
        width: 100%;
        height: 18px;
        background: #ece1ff;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8b64d9, #5d3d9b);
        transition: width 0.25s ease;
      }

      .timetable-wrap {
        margin-top: 18px;
      }

      .day-block {
        background: rgba(255,255,255,0.3);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 18px;
      }

      .day-title {
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--purple-900);
        margin: 0 0 12px;
      }

      .lec-list {
        display: grid;
        gap: 12px;
      }

      .lec-item {
        display: grid;
        grid-template-columns: 160px 1fr auto;
        align-items: center;
        gap: 16px;
        background: rgba(255,255,255,0.74);
        border: 1px solid rgba(122, 90, 181, 0.16);
        border-radius: 18px;
        padding: 12px 14px;
      }

      .time {
        font-weight: 800;
        color: var(--purple-800);
        background: #f2e8ff;
        border-radius: 12px;
        padding: 10px 12px;
        text-align: center;
      }

      .course-name {
        font-weight: 800;
        color: var(--text);
        margin: 0 0 6px;
        font-size: 1.02rem;
      }

      .course-meta {
        color: var(--muted);
        font-size: 0.93rem;
        line-height: 1.6;
      }

      .check-box-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .check-box-wrap input {
        width: 22px;
        height: 22px;
        accent-color: var(--purple-600);
        cursor: pointer;
      }

      .lec-item.done .course-name,
      .lec-item.done .course-meta {
        opacity: 0.58;
        text-decoration: line-through;
      }

      @media (max-width: 760px) {
        .hero-card { padding: 24px 18px; }

        .lec-item {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .time { width: 100%; }
      }
    </style>
  </head>

    <div id="sectionPage" class="screen">

    </div>

      const state = { group: null, section: null };

        home: document.getElementById("homePage"),
        section: document.getElementById("sectionPage"),
        timetable: document.getElementById("timetablePage")
      };

      const groupGrid = document.getElementById("groupGrid");
      const sectionGrid = document.getElementById("sectionGrid");
      const sectionTitle = document.getElementById("sectionTitle");
      const timetableTitle = document.getElementById("timetableTitle");
      const timetableContainer = document.getElementById("timetableContainer");
      const progressLabel = document.getElementById("progressLabel");
      const progressFill = document.getElementById("progressFill");

      function showScreen(name) {
        Object.keys(screens).forEach(key => screens[key].classList.toggle("active", key === name));
      }

      function renderGroups() {
        groupGrid.innerHTML = "";

        Object.entries(timetableData).forEach(([key, value]) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "group-card";
          card.innerHTML = `
            <div class="group-icon">${key}</div>
            <h3>${value.label}</h3>
            <p>${value.sections && Object.keys(value.sections).length ? "Choose section" : "Open timetable"}</p>
          `;

          card.addEventListener("click", () => {
            state.group = key;
            state.section = null;

            if (value.sections && Object.keys(value.sections).length) {
              renderSections();
              showScreen("section");
            } else {
              state.section = "General";
              renderTimetable();
              showScreen("timetable");
            }
          });

          groupGrid.appendChild(card);
        });
      }

      function renderSections() {
        const group = timetableData[state.group];
        const keys = Object.keys(group.sections || {});

        sectionTitle.textContent = `${group.label} — Choose a section`;
        sectionGrid.innerHTML = "";

        keys.forEach((key) => {
          const sectionBtn = document.createElement("button");
          sectionBtn.type = "button";
          sectionBtn.className = "section-card";
          sectionBtn.innerHTML = `
            <div class="section-number">${key.replace(/[^0-9]/g, "") || "G"}</div>
            <h3>${key}</h3>
            <p>Open timetable</p>
          `;

          sectionBtn.addEventListener("click", () => {
            state.section = key;
            renderTimetable();
            showScreen("timetable");
          });

          sectionGrid.appendChild(sectionBtn);
        });
      }

      function getSelectedSchedule() {
        const group = timetableData[state.group];
        if (!group) return [];

        const base = group.sections ? (group.sections[state.section] || []) : [];
        return base;
      }

      function getLectureId(item) {
        return `${state.group}-${state.section || "General"}-${item.day}-${item.time}-${item.subject}-${item.room}`;
      }

      function parseTime(value) {
        const regex = /(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/i;
        const match = value.match(regex);
        if (!match) return Number.MAX_SAFE_INTEGER;

        const start = Number(match[1]) + Number(match[2]) / 60;
        const end = Number(match[3]) + Number(match[4]) / 60;
        return { start, end };
      }

      function renderTimetable() {
        const group = timetableData[state.group];
        const sectionKey = state.section || "General";
        const lectures = getSelectedSchedule();

        timetableTitle.textContent = `${group.label} ${sectionKey}`;
        timetableContainer.innerHTML = "";

        const byDay = {};
        lectures.forEach((lecture) => {
          if (!byDay[lecture.day]) byDay[lecture.day] = [];
          byDay[lecture.day].push(lecture);
        });

        let totalLectures = 0;
        Object.values(byDay).forEach(list => totalLectures += list.length);

        let checkedCount = 0;
        const storage = JSON.parse(localStorage.getItem("dentalRenadProgress") || "{}");

        dayOrder.forEach((day) => {
          if (!byDay[day] || !byDay[day].length) return;

          const dayBlock = document.createElement("div");
          dayBlock.className = "day-block";

          const title = document.createElement("h3");
          title.className = "day-title";
          title.textContent = day;
          dayBlock.appendChild(title);

          const list = document.createElement("div");
          list.className = "lec-list";

          byDay[day]
            .slice()
            .sort((a, b) => parseTime(a.time).start - parseTime(b.time).start)
            .forEach((lecture) => {
              totalLectures += 0;
              const item = document.createElement("div");
              item.className = "lec-item";

              const lectureId = getLectureId(lecture);
              const checked = Boolean(storage[lectureId]);
              if (checked) checkedCount += 1;

              const time = document.createElement("div");
              time.className = "time";
              time.textContent = lecture.time;
              item.appendChild(time);

              const courseBox = document.createElement("div");
              courseBox.innerHTML = `
                <div class="course-name">${lecture.subject} (${lecture.code})</div>
                <div class="course-meta">${lecture.type} • ${lecture.room}</div>
              `;
              item.appendChild(courseBox);

              const checkWrap = document.createElement("div");
              checkWrap.className = "check-box-wrap";
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.checked = checked;
              checkbox.setAttribute("aria-label", lecture.subject);
              checkbox.addEventListener("change", () => {
                const saved = JSON.parse(localStorage.getItem("dentalRenadProgress") || "{}");
                if (checkbox.checked) saved[lectureId] = true; else delete saved[lectureId];
                localStorage.setItem("dentalRenadProgress", JSON.stringify(saved));
                updateProgress();
                item.classList.toggle("done", checkbox.checked);
              });

              if (checked) item.classList.add("done");

              checkWrap.appendChild(checkbox);
              item.appendChild(checkWrap);
              list.appendChild(item);
            });

          dayBlock.appendChild(list);
          timetableContainer.appendChild(dayBlock);
        });

        updateProgress();
      }

      function updateProgress() {
        const group = timetableData[state.group];
        if (!group) return;

        const lectures = getSelectedSchedule();
        const storage = JSON.parse(localStorage.getItem("dentalRenadProgress") || "{}");
        let checkedCount = 0;

        lectures.forEach((lecture) => {
          const key = getLectureId(lecture);
          if (storage[key]) checkedCount += 1;
        });

        const total = lectures.length || 0;
        const percent = total ? Math.round((checkedCount / total) * 100) : 0;

        progressLabel.textContent = `${percent}%`;
        progressFill.style.width = `${percent}%`;
      }

        showScreen("home");
      });

      document.getElementById("backToSectionsBtn").addEventListener("click", () => {
        renderSections();
        showScreen("section");
      });

      document.getElementById("homeBtn").addEventListener("click", () => {
        state.group = null;
        state.section = null;
        showScreen("home");
      });

      renderGroups();
      showScreen("home");
